name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests (fails below 85% domain coverage)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: No server-only secrets in client bundle
        run: npm run check:client-bundle

  database-and-e2e:
    # Row-level security, repository contracts, auth, and the Playwright
    # suite need a real Postgres. Throwaway databases only — the scripts
    # refuse any host but localhost.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap local roles and dev database
        run: |
          bash scripts/db-bootstrap.sh
          printf '%s\n' \
            "LOCAL_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/taskmaster_dev" \
            "LOCAL_DATABASE_URL_APP=postgresql://taskmaster_app:taskmaster_app_local_dev@localhost:5432/taskmaster_dev" \
            > .env.local

      - name: Database tests (RLS isolation, repositories, auth)
        run: npm run db:test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (PRD §2.10 + WCAG 2.1 AA)
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
