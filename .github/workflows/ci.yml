name: CI

on:
  push:
    branches: [main]
  pull_request:

# Monorepo: npm workspaces install once at the root; web steps run in
# apps/web, Flutter steps in apps/mobile.
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests (fails below 85% domain coverage)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: No server-only secrets in client bundle
        run: npm run check:client-bundle

  database-and-e2e:
    # Row-level security, repository contracts, auth, and the Playwright
    # suite need a real Postgres. Throwaway databases only — the scripts
    # refuse any host but localhost.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/web
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        working-directory: .
        run: npm ci

      # Sign-in (ADR-013): the local Supabase stack provides Auth + Mailpit.
      # App data stays in the Postgres service above.
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase Auth
        working-directory: .
        run: |
          cp supabase/.env.example supabase/.env
          npm run supabase:start

      - name: README quick start (bootstrap, migrate, dev server)
        run: |
          npm run db:bootstrap
          cp .env.example .env.local
          {
            echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/taskmaster_dev"
            echo "DATABASE_URL_APP=postgresql://taskmaster_app:taskmaster_app_local_dev@localhost:5432/taskmaster_dev"
            echo "LOCAL_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/taskmaster_dev"
            echo "LOCAL_DATABASE_URL_APP=postgresql://taskmaster_app:taskmaster_app_local_dev@localhost:5432/taskmaster_dev"
            supabase status --workdir ../.. -o env \
              --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
              --override-name auth.publishable_key=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
              --override-name auth.secret_key=SUPABASE_SECRET_KEY \
              | grep -E '^(NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY|SUPABASE_SECRET_KEY)='
          } >> .env.local
          npm run db:migrate
          npm run dev > dev.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl --fail --silent http://localhost:3000/api/health && break
            sleep 2
          done
          curl --fail --silent --show-error http://localhost:3000/api/health
          curl --fail --silent --show-error --output /dev/null http://localhost:3000/signup
          kill %1 || true

      - name: Database tests (RLS isolation, repositories, auth)
        run: npm run db:test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (PRD §2.10 + WCAG 2.1 AA)
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Lint the OpenAPI contract
        run: npm run api:lint

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
