name: Deploy

# Production path: CI green on main -> migrate the production database ->
# build and deploy to Vercel -> health check (docs/OPERATIONS.md).
# vercel.json turns off Vercel's own deploys of main, so production only
# ever ships through here, after its migrations. Pull requests still get
# Vercel preview deployments from the Git integration.
#
# Off until the repository variable DEPLOY_ENABLED is "true", and gated on
# the "production" environment (add required reviewers there to approve
# each deploy by hand).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI actually tested, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Migrate production database
        run: npm run db:migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}

      - name: Build
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Health check
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error "${{ vars.PRODUCTION_URL }}/api/health"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Production health check failed. Roll back: docs/OPERATIONS.md"
          exit 1
