openapi: 3.1.0
info:
  title: TaskMasterAi API
  version: 1.0.0
  description: |
    Versioned JSON API for the TaskMasterAi mobile app. Every endpoint
    requires `Authorization: Bearer <session token>` (see README.md).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:3000
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Account
    description: The signed-in user.
  - name: Today
    description: The daily plan and Next Best Action.
  - name: Tasks
    description: Listing, capturing and acting on tasks.
  - name: Projects
    description: Projects and their progress.
  - name: Capture
    description: Brain Dump — organise, review, commit.
  - name: Planner
    description: AI Planner — propose and apply a timeline for today.
  - name: Goals
    description: Goals and recurring responsibilities.
  - name: Reviews
    description: Daily and weekly reviews.
  - name: Calendar
    description: Read-only calendar feeds that Today plans around.
paths:
  /api/v1/me:
    get:
      tags: [Account]
      operationId: getMe
      summary: The signed-in user
      parameters:
        - $ref: "#/components/parameters/TimeZone"
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Account]
      operationId: updatePreferences
      summary: Save preferences (any subset)
      parameters:
        - $ref: "#/components/parameters/TimeZone"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Preferences"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Account]
      operationId: deleteAccount
      summary: Permanently delete the account and all its data
      description: |
        Type `DELETE` to confirm. Accounts with a password must send it;
        Google-only accounts must have signed in within the last 10 minutes
        (403 otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation:
                  const: DELETE
                password:
                  type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/today:
    get:
      tags: [Today]
      operationId: getToday
      summary: Today's plan, Next Best Action and stats
      description: |
        The same plan the web's Today page renders. `onboarded: false` means
        the user hasn't completed their first Brain Dump yet.
      parameters:
        - $ref: "#/components/parameters/TimeZone"
      responses:
        "200":
          description: Today
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Today"
                  - $ref: "#/components/schemas/NotOnboarded"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: My Tasks, filtered by view
      parameters:
        - $ref: "#/components/parameters/TimeZone"
        - name: view
          in: query
          description: |
            today — open work due today or overdue; upcoming — due later;
            all — every open task; inbox — captured, not yet organised.
          schema:
            type: string
            enum: [today, upcoming, all, inbox]
            default: today
      responses:
        "200":
          description: Tasks, earliest deadline first
          content:
            application/json:
              schema:
                type: object
                required: [view, tasks]
                properties:
                  view:
                    type: string
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Tasks]
      operationId: quickAdd
      summary: Quick Add — capture a task into the Inbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 500
                dueAt:
                  type: [string, "null"]
                  format: date-time
                projectId:
                  description: Add straight into this project as a to-do (otherwise the Inbox).
                  type: [string, "null"]
                  format: uuid
                goalId:
                  description: Link to this goal; the task is added as a to-do.
                  type: [string, "null"]
                  format: uuid
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [task]
                properties:
                  task:
                    $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/tasks/{id}/status:
    post:
      tags: [Tasks]
      operationId: setTaskStatus
      summary: Start, complete, postpone or drop a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [todo, in_progress, completed, postponed, dropped]
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: Projects with completion progress
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/ProjectProgress"
                        - type: object
                          required: [open]
                          properties:
                            open:
                              type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/dumps:
    post:
      tags: [Capture]
      operationId: createBrainDump
      summary: Save a Brain Dump and organise it into a proposal
      description: |
        The text is saved first, then organised by Claude (when configured and
        within the hourly quota) or the built-in rules. Nothing becomes a task
        until the reviewed items are committed.
      parameters:
        - $ref: "#/components/parameters/TimeZone"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 20000
      responses:
        "201":
          description: Proposal to review
          content:
            application/json:
              schema:
                type: object
                required: [dumpId, engine, notice, items]
                properties:
                  dumpId:
                    type: string
                    format: uuid
                  engine:
                    type: string
                    enum: [ai, heuristic]
                  notice:
                    description: Why the built-in rules were used, when they were.
                    type: [string, "null"]
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProposedItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/dumps/{id}/commit:
    post:
      tags: [Capture]
      operationId: commitBrainDump
      summary: Save the reviewed items (all or nothing); completes onboarding
      parameters:
        - $ref: "#/components/parameters/TimeZone"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    $ref: "#/components/schemas/ReviewedItem"
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [summary]
                properties:
                  summary:
                    type: object
                    required: [dumpId, tasks, projects, goals, habits, notes]
                    properties:
                      dumpId:
                        type: string
                        format: uuid
                      tasks:
                        type: integer
                      projects:
                        type: integer
                      goals:
                        type: integer
                      habits:
                        type: integer
                      notes:
                        type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/projects/{id}:
    get:
      tags: [Projects]
      operationId: getProject
      summary: One project with its tasks, grouped by status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                type: object
                required: [project, inProgress, todo, postponed]
                properties:
                  project:
                    $ref: "#/components/schemas/ProjectProgress"
                  inProgress:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"
                  todo:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"
                  postponed:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/planner:
    post:
      tags: [Planner]
      operationId: proposePlan
      summary: AI Planner — propose a timeline for today (nothing is saved)
      description: |
        Claude when configured and within the hourly quota (`engine: ai`),
        otherwise today's rules plan (`engine: rules`). Task blocks only ever
        reference the user's own open tasks; breaks and events are suggestions.
      parameters:
        - $ref: "#/components/parameters/TimeZone"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 1000
                history:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required: [role, text]
                    properties:
                      role:
                        type: string
                        enum: [user, assistant]
                      text:
                        type: string
                        maxLength: 2000
      responses:
        "200":
          description: Proposed timeline
          content:
            application/json:
              schema:
                type: object
                required: [engine, reply, blocks]
                properties:
                  engine:
                    type: string
                    enum: [ai, rules]
                  reply:
                    type: string
                  blocks:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlannerBlock"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Not onboarded yet — nothing to plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/planner/apply:
    post:
      tags: [Planner]
      operationId: applyPlan
      summary: Save a proposed timeline's task blocks as today's plan
      parameters:
        - $ref: "#/components/parameters/TimeZone"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blocks]
              properties:
                blocks:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [taskId, start, minutes]
                    properties:
                      taskId:
                        type: string
                        format: uuid
                      start:
                        type: string
                        pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
                      minutes:
                        type: integer
                        minimum: 5
                        maximum: 480
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [ok, scheduled]
                properties:
                  ok:
                    type: boolean
                  scheduled:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/today/settings:
    put:
      tags: [Today]
      operationId: rebuildToday
      summary: Rebuild today's plan around available time and energy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TodaySettings"
      responses:
        "200":
          description: Rebuilt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/today/next:
    put:
      tags: [Today]
      operationId: chooseNext
      summary: Choose your own next action (null clears it)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskId]
              properties:
                taskId:
                  type: [string, "null"]
                  format: uuid
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/today/recovery:
    post:
      tags: [Today]
      operationId: recoverMissed
      summary: Keep, postpone or drop missed plan blocks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decisions]
              properties:
                decisions:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [id, choice]
                    properties:
                      id:
                        description: The recovery item id (not the task id).
                        type: string
                        format: uuid
                      choice:
                        type: string
                        enum: [keep, postpone, drop]
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/tasks/organise:
    post:
      tags: [Tasks]
      operationId: organiseInbox
      summary: Move Inbox items onto the list, optionally into a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: string
                    format: uuid
                project:
                  description: Project name; a new name creates the project.
                  type: [string, "null"]
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema:
                type: object
                required: [moved]
                properties:
                  moved:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Tasks]
      operationId: getTask
      summary: One task with steps, suggested steps, history and pickers
      responses:
        "200":
          description: Task detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Tasks]
      operationId: updateTask
      summary: Edit a task (any subset of fields)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [task]
                properties:
                  task:
                    $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Tasks]
      operationId: deleteTask
      summary: Delete a task
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/tasks/{id}/breakdown:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Tasks]
      operationId: breakDownTask
      summary: Save reviewed steps for a large or vague task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [steps]
              properties:
                steps:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [title, estimatedMinutes]
                    properties:
                      title:
                        type: string
                      estimatedMinutes:
                        type: [integer, "null"]
      responses:
        "201":
          description: Steps saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/goals:
    get:
      tags: [Goals]
      operationId: listGoals
      summary: Goals with progress and a nudge when nothing moves them
      responses:
        "200":
          description: Goals
          content:
            application/json:
              schema:
                type: object
                required: [goals]
                properties:
                  goals:
                    type: array
                    items:
                      $ref: "#/components/schemas/Goal"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Goals]
      operationId: createGoal
      summary: Add a goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                targetDate:
                  type: [string, "null"]
                  format: date
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [goal]
                properties:
                  goal:
                    type: object
                    required: [id, title]
                    properties:
                      id:
                        type: string
                        format: uuid
                      title:
                        type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/responsibilities:
    get:
      tags: [Goals]
      operationId: listResponsibilities
      summary: Recurring responsibilities and their next 30 days
      parameters:
        - $ref: "#/components/parameters/TimeZone"
      responses:
        "200":
          description: Responsibilities
          content:
            application/json:
              schema:
                type: object
                required: [responsibilities]
                properties:
                  responsibilities:
                    type: array
                    items:
                      $ref: "#/components/schemas/Responsibility"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/responsibilities/{id}/stop:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Goals]
      operationId: stopResponsibility
      summary: Stop future instances (history is kept)
      responses:
        "200":
          description: Stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/reviews/daily:
    get:
      tags: [Reviews]
      operationId: dailyReview
      summary: Close the day
      parameters:
        - $ref: "#/components/parameters/TimeZone"
      responses:
        "200":
          description: Daily review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyReview"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/reviews/weekly:
    get:
      tags: [Reviews]
      operationId: weeklyReview
      summary: Choose what deserves next week
      parameters:
        - $ref: "#/components/parameters/TimeZone"
      responses:
        "200":
          description: Weekly review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyReview"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/calendars:
    get:
      tags: [Calendar]
      operationId: listCalendars
      summary: Connected calendars (the private address is never returned)
      responses:
        "200":
          description: Calendars
          content:
            application/json:
              schema:
                type: object
                required: [calendars]
                properties:
                  calendars:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConnectedCalendar"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Calendar]
      operationId: connectCalendar
      summary: Connect a calendar by its private iCal address
      description: |
        The feed is read once immediately, so a wrong address fails here
        (422) with a message to show. https:// and webcal:// only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                label:
                  type: string
      responses:
        "201":
          description: Connected
          content:
            application/json:
              schema:
                type: object
                required: [id, events]
                properties:
                  id:
                    type: string
                    format: uuid
                  events:
                    description: Events found in the next five weeks.
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: The address couldn't be read as a calendar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [Calendar]
      operationId: refreshCalendars
      summary: Refresh every connected calendar now
      responses:
        "200":
          description: Refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/calendars/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      tags: [Calendar]
      operationId: disconnectCalendar
      summary: Disconnect a calendar and drop its events
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Supabase Auth access token (the session's `access_token`).
  parameters:
    TimeZone:
      name: X-Time-Zone
      in: header
      required: false
      description: Device IANA time zone; used until the user saves one in Settings.
      schema:
        type: string
        example: Europe/London
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Forbidden:
      description: Not allowed right now (e.g. sign in again first)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The data changed or a precondition isn't met; refresh and retry
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, invalid, expired or revoked token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found (or not yours)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Ok:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    Me:
      type: object
      required: [id, name, email, timeZone, onboarded]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        timeZone:
          type: string
        onboarded:
          type: boolean
        preferences:
          type: object
          required: [timeZone, dayMinutes, planMode, notifications]
          properties:
            timeZone:
              description: The saved time zone, or null while the device's is used.
              type: [string, "null"]
            dayMinutes:
              type: integer
            planMode:
              type: string
              enum: [flexible, scheduled]
            notifications:
              type: string
              enum: ["off", important]
        hasPassword:
          description: Account deletion asks for the password when true.
          type: boolean
    TaskStatus:
      type: string
      enum: [inbox, todo, in_progress, completed, postponed, dropped]
    Task:
      type: object
      required: [id, title, status, priority, dueAt, estimatedMinutes, project]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          description: The user's own priority, 1 (low) to 5 (high).
          type: [integer, "null"]
          minimum: 1
          maximum: 5
        dueAt:
          type: [string, "null"]
          format: date-time
        estimatedMinutes:
          type: [integer, "null"]
        project:
          oneOf:
            - type: "null"
            - type: object
              required: [id, name]
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
    PlanItem:
      type: object
      required: [task, position, minutes, estimateIsDefault, protected, scheduledStart, scheduledEnd]
      properties:
        task:
          $ref: "#/components/schemas/Task"
        position:
          type: integer
        minutes:
          type: integer
        estimateIsDefault:
          type: boolean
        protected:
          description: Held for long-term work so urgent tasks don't crowd it out.
          type: boolean
        scheduledStart:
          type: [string, "null"]
          format: date-time
        scheduledEnd:
          type: [string, "null"]
          format: date-time
    ProjectProgress:
      type: object
      required: [id, name, done, total]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        done:
          type: integer
        total:
          type: integer
    NotOnboarded:
      type: object
      required: [onboarded, greeting, firstName]
      properties:
        onboarded:
          const: false
        greeting:
          type: string
        firstName:
          type: string
    ProposedItem:
      type: object
      required: [kind, title, deadline, recurrence, estimatedMinutes, project]
      properties:
        kind:
          type: string
          enum: [task, project, goal, note, recurring]
        title:
          type: string
        deadline:
          oneOf:
            - type: "null"
            - type: object
              required: [at, confidence, source]
              properties:
                at:
                  type: string
                  format: date-time
                confidence:
                  type: number
                source:
                  type: string
        recurrence:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Recurrence"
        estimatedMinutes:
          type: [integer, "null"]
        project:
          type: [string, "null"]
    ReviewedItem:
      type: object
      required: [kind, title, dueAt, recurrence, estimatedMinutes, project, importance]
      properties:
        kind:
          type: string
          enum: [task, project, goal, note, recurring]
        title:
          type: string
          minLength: 1
          maxLength: 500
        dueAt:
          type: [string, "null"]
          format: date-time
        recurrence:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Recurrence"
        estimatedMinutes:
          type: [integer, "null"]
        project:
          type: [string, "null"]
        importance:
          type: [integer, "null"]
    Recurrence:
      type: object
      required: [frequency, timesPerPeriod]
      properties:
        frequency:
          type: string
          enum: [daily, weekly, monthly]
        timesPerPeriod:
          type: integer
    PlannerBlock:
      type: object
      required: [kind, taskId, title, project, start, minutes]
      properties:
        kind:
          type: string
          enum: [task, break, event]
        taskId:
          type: [string, "null"]
          format: uuid
        title:
          type: string
        project:
          type: [string, "null"]
        start:
          description: Local 24-hour time, HH:MM.
          type: string
        minutes:
          type: integer
    Today:
      type: object
      required: [onboarded, date, greeting, firstName, stats, recommendation, plan, capacity, projects, attention]
      properties:
        onboarded:
          const: true
        date:
          description: The user's local date (YYYY-MM-DD).
          type: string
          format: date
        greeting:
          type: string
        firstName:
          type: string
        stats:
          type: object
          required: [active, dueToday, completedToday, inbox]
          properties:
            active:
              type: integer
            dueToday:
              type: integer
            completedToday:
              type: integer
            inbox:
              type: integer
        recommendation:
          description: The Next Best Action — an AI suggestion unless `overridden`.
          oneOf:
            - type: "null"
            - type: object
              required: [task, message, reasons, overridden]
              properties:
                task:
                  $ref: "#/components/schemas/Task"
                message:
                  type: string
                reasons:
                  type: array
                  items:
                    type: string
                overridden:
                  description: True when the user chose their own next action.
                  type: boolean
        plan:
          type: array
          items:
            $ref: "#/components/schemas/PlanItem"
        capacity:
          type: object
          required: [plannedMinutes, availableMinutes, usableMinutes, overloaded]
          properties:
            plannedMinutes:
              type: integer
            availableMinutes:
              type: [integer, "null"]
            usableMinutes:
              type: [integer, "null"]
            overloaded:
              type: boolean
        projects:
          type: array
          items:
            $ref: "#/components/schemas/ProjectProgress"
        settings:
          $ref: "#/components/schemas/TodaySettings"
        recovery:
          description: Missed plan blocks waiting for a keep/postpone/drop decision.
          type: array
          items:
            type: object
            required: [id, taskId, title, scheduledEnd]
            properties:
              id:
                type: string
                format: uuid
              taskId:
                type: string
                format: uuid
              title:
                type: string
              scheduledEnd:
                type: [string, "null"]
                format: date-time
        realityCheck:
          description: Present when deadline-critical work exceeds usable time.
          oneOf:
            - type: "null"
            - type: object
              required: [workMinutes, usableMinutes, excessMinutes, tasks]
              properties:
                workMinutes:
                  type: integer
                usableMinutes:
                  type: integer
                excessMinutes:
                  type: integer
                tasks:
                  type: array
                  items:
                    type: object
                    required: [id, title, minutes]
                    properties:
                      id:
                        type: string
                        format: uuid
                      title:
                        type: string
                      minutes:
                        type: integer
        events:
          description: Today's calendar events (all-day ones don't take time).
          type: array
          items:
            $ref: "#/components/schemas/CalendarEvent"
        meetingMinutes:
          description: Meeting time still ahead today, already taken out of capacity.
          type: integer
        procrastination:
          description: Tasks postponed three times in a row.
          type: array
          items:
            type: object
            required: [taskId, title]
            properties:
              taskId:
                type: string
                format: uuid
              title:
                type: string
        attention:
          description: Counts of pending decisions (recovery, Reality Check).
          type: object
          required: [recovery, realityCheck]
          properties:
            recovery:
              type: integer
            realityCheck:
              type: boolean
    Preferences:
      type: object
      properties:
        timeZone:
          type: string
        dayMinutes:
          type: integer
          minimum: 1
          maximum: 1440
        planMode:
          type: string
          enum: [flexible, scheduled]
        notifications:
          type: string
          enum: ["off", important]
    TodaySettings:
      type: object
      required: [dayMinutes]
      properties:
        dayMinutes:
          type: integer
          minimum: 1
          maximum: 1440
        availableMinutes:
          type: [integer, "null"]
        energy:
          type: [string, "null"]
          enum: [low, medium, high, null]
    StepRef:
      type: object
      required: [id, title, status]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
    TaskDetail:
      type: object
      required: [task, steps, suggestedSteps, canBreakDown, history, projects, goals]
      properties:
        task:
          allOf:
            - $ref: "#/components/schemas/Task"
            - type: object
              properties:
                description:
                  type: [string, "null"]
                importance:
                  type: [integer, "null"]
                urgency:
                  type: [integer, "null"]
                energy:
                  type: [string, "null"]
                goal:
                  oneOf:
                    - type: "null"
                    - type: object
                      required: [id, title]
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                parentTaskId:
                  type: [string, "null"]
        steps:
          type: array
          items:
            $ref: "#/components/schemas/StepRef"
        suggestedSteps:
          description: Suggested steps when the task has none yet.
          type: array
          items:
            type: string
        canBreakDown:
          type: boolean
        history:
          type: array
          items:
            type: object
            required: [type, at]
            properties:
              type:
                type: string
              toStatus:
                type: [string, "null"]
              at:
                type: string
                format: date-time
        projects:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
        goals:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              title:
                type: string
    TaskPatch:
      type: object
      properties:
        title:
          type: string
        description:
          type: [string, "null"]
        dueAt:
          type: [string, "null"]
          format: date-time
        estimatedMinutes:
          type: [integer, "null"]
        priority:
          type: [integer, "null"]
        importance:
          type: [integer, "null"]
        urgency:
          type: [integer, "null"]
        energy:
          type: [string, "null"]
          enum: [low, medium, high, null]
        project:
          description: Project name; a new name creates it, null removes it.
          type: [string, "null"]
        goal:
          description: Goal title; a new title creates it, null removes it.
          type: [string, "null"]
    Goal:
      type: object
      required: [id, title, targetDate, linked, active, completed, nudge, tasks]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        targetDate:
          type: [string, "null"]
          format: date
        linked:
          type: integer
        active:
          type: integer
        completed:
          type: integer
        nudge:
          description: unlinked — nothing moves it yet; stalled — only postponed work left.
          type: [string, "null"]
          enum: [unlinked, stalled, null]
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
    Responsibility:
      type: object
      required: [id, title, frequency, intervalCount, timesPerPeriod, endDate, stopped, upcoming]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        frequency:
          type: string
          enum: [daily, weekly, monthly]
        intervalCount:
          type: integer
        timesPerPeriod:
          type: integer
        endDate:
          type: [string, "null"]
          format: date
        stopped:
          type: boolean
        upcoming:
          type: array
          items:
            type: object
            required: [id, title, status, date]
            properties:
              id:
                type: string
              title:
                type: string
              status:
                $ref: "#/components/schemas/TaskStatus"
              date:
                type: string
                format: date
    TaskRef:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
        title:
          type: string
    DailyReview:
      type: object
      required: [date, completed, missed, carried, changed]
      properties:
        date:
          type: string
          format: date
        completed:
          type: array
          items:
            $ref: "#/components/schemas/TaskRef"
        missed:
          type: array
          items:
            $ref: "#/components/schemas/TaskRef"
        carried:
          type: array
          items:
            $ref: "#/components/schemas/TaskRef"
        changed:
          type: array
          items:
            $ref: "#/components/schemas/TaskRef"
    WeeklyReview:
      type: object
      required: [startDate, endDate, goals, deadlines, postponed, insights]
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        goals:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              title:
                type: string
              completed:
                type: integer
        deadlines:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              title:
                type: string
              dueAt:
                type: [string, "null"]
                format: date-time
        postponed:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              title:
                type: string
              times:
                type: integer
        insights:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
              message:
                type: string
    ConnectedCalendar:
      type: object
      required: [id, label, lastSyncedAt, error]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        lastSyncedAt:
          type: [string, "null"]
          format: date-time
        error:
          description: Why the last refresh failed, if it did (old events are kept).
          type: [string, "null"]
    CalendarEvent:
      type: object
      required: [title, startsAt, endsAt, allDay]
      properties:
        title:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        allDay:
          type: boolean
