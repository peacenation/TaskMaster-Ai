# Netlify: the Next.js app lives in apps/web (npm workspaces monorepo).
# Building from apps/web puts the output where @netlify/plugin-nextjs looks
# for it (apps/web/.next); `npm install` there installs the whole workspace.
# Overrides the build settings in the Netlify UI.
[build]
  base = "apps/web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Turbopack's build cache records the values of env vars server code reads
  # (to know when to rebuild), so Netlify's secret scanner finds secrets
  # marked "secret" there. The cache is never published or served; the
  # deployed client bundle is checked by npm run check:client-bundle in CI.
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**,.next/cache/**"

[[plugins]]
  package = "@netlify/plugin-nextjs"
