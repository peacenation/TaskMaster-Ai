# App icon (dart run flutter_launcher_icons). Sources in assets/branding,
# drawn from the TaskMasterAi mark (see assets/branding/README.md).
flutter_launcher_icons:
  image_path: assets/branding/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 24
  # Android 8+ adaptive icon: the mark inside the safe zone on espresso, so
  # circle, squircle and teardrop masks never crop it.
  adaptive_icon_background: "#35251F"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  # Android 13+ themed icon (tinted to the wallpaper by the launcher).
  adaptive_icon_monochrome: assets/branding/icon_monochrome.png
