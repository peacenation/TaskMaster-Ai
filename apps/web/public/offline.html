<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#5a4632" />
    <title>Offline · TaskMaster</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbf6ee;
        --card: #fffdf9;
        --text: #2e2013;
        --muted: #6f5a44;
        --primary: #5a4632;
        --on-primary: #fbf6ee;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c140d;
          --card: #2a1f16;
          --text: #f5ecdc;
          --muted: #c9b8a0;
          --primary: #ecdfc4;
          --on-primary: #2e2013;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        padding: 16px;
        box-sizing: border-box;
      }
      main {
        max-width: 26rem;
        background: var(--card);
        border-radius: 16px;
        padding: 32px 24px;
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 14px;
      }
      h1 {
        font-size: 1.375rem;
        margin: 16px 0 8px;
      }
      p {
        color: var(--muted);
        line-height: 1.5;
        margin: 0 0 24px;
      }
      button {
        font: inherit;
        font-weight: 600;
        background: var(--primary);
        color: var(--on-primary);
        border: 0;
        border-radius: 10px;
        padding: 12px 20px;
        min-height: 44px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>
        TaskMaster needs a connection to load your tasks. Nothing you've saved is lost —
        reconnect and try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
